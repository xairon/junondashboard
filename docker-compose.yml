services:
  juno-redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 900mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          # cpus: "0.5"

  backend:
    build: ./backend
    env_file: .env
    restart: unless-stopped
    networks:
      - default
      - brgm
    depends_on:
      juno-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          # cpus: "1.0"

  frontend:
    build: ./frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "49510:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          # cpus: "0.5"

  e2e:
    build: ./e2e
    profiles: ["test"]
    volumes:
      - ./e2e/report:/e2e/report
      - ./docs/assets:/e2e/docs-assets
    environment:
      - BASE_URL=http://nginx:80

networks:
  brgm:
    external: true
    name: hubeau_data_integration_default

volumes:
  redis-data:
