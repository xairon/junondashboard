worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/json application/geo+json text/plain text/css application/javascript application/xml text/xml image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

    # Connection limits
    limit_conn_zone $binary_remote_addr zone=connlimit:10m;

    upstream backend_pool {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_pool {
        server frontend:80;
        keepalive 16;
    }

    server {
        listen 80;
        client_max_body_size 1m;
        client_body_timeout 10s;
        client_header_timeout 10s;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-XSS-Protection "1; mode=block" always;

        limit_conn connlimit 20;

        # WFS layers — pre-compressed, long cache, skip nginx gzip
        location ~ ^/api/v1/wfs/ {
            limit_req zone=api burst=20 nodelay;
            gzip off;
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Accept-Encoding $http_accept_encoding;
            proxy_buffering off;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # API — cacheable station data
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend_pool/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
            add_header Cache-Control "public, max-age=300" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://frontend_pool/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
