worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/json application/geo+json text/plain text/css application/javascript application/xml text/xml image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

    # Connection limits
    limit_conn_zone $binary_remote_addr zone=connlimit:10m;

    upstream backend_pool {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_pool {
        server frontend:80;
        keepalive 16;
    }

    server {
        listen 80;
        client_max_body_size 1m;
        client_body_timeout 10s;
        client_header_timeout 10s;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self' http://dib-2019006065.univ-tours.local:49513 https://dib-2019006065.univ-tours.local:49513" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-XSS-Protection "1; mode=block" always;

        limit_conn connlimit 20;

        # WFS layers — pre-compressed, long cache, skip nginx gzip
        location ~ ^/api/v1/wfs/ {
            limit_req zone=api burst=20 nodelay;
            gzip off;
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Accept-Encoding $http_accept_encoding;
            proxy_buffering off;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "frame-ancestors 'self' http://dib-2019006065.univ-tours.local:49513 https://dib-2019006065.univ-tours.local:49513" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # API — cacheable station data
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend_pool/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
            add_header Cache-Control "public, max-age=300" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "frame-ancestors 'self' http://dib-2019006065.univ-tours.local:49513 https://dib-2019006065.univ-tours.local:49513" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://frontend_pool/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Accept-Encoding "";

            # Inject Junon Explorer bridge script inline when loaded in iframe
            sub_filter '</body>' '<script>(function(){if(window.parent===window)return;var lastCode=null;function extract(){var d=document.querySelector("[role=dialog]");if(!d)return null;var a=d.getAttribute("aria-label")||"";var m=a.match(/Station\s+(.+)/);if(!m)return null;var code=m[1].trim();var tb=d.querySelector("[class*=bg-accent-cyan]");var type="piezo";if(!tb){tb=d.querySelector("[class*=bg-accent-indigo]");if(tb)type="hydro"}var h=d.querySelector("h3");var name=h?h.textContent.trim():code;return{code:code,type:type,name:name}}function addBtn(d,info){if(d.querySelector(".junon-train-btn"))return;var b=document.createElement("button");b.className="junon-train-btn";b.textContent="\\u26A1 Analyser dans Junon";b.style.cssText="display:block;width:calc(100% - 32px);margin:12px 16px;padding:10px 16px;background:linear-gradient(135deg,#06b6d4,#3b82f6);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-align:center";b.onclick=function(){window.parent.postMessage({type:"OBSERVATORY_TRAIN",station:info},"*")};var link=d.querySelector("a[href*=station]");if(link)link.parentNode.insertBefore(b,link);else d.appendChild(b)}function check(){var info=extract();if(info&&info.code!==lastCode){lastCode=info.code;window.parent.postMessage({type:"OBSERVATORY_STATION_SELECTED",station:info},"*")}if(!info&&lastCode!==null){lastCode=null;window.parent.postMessage({type:"OBSERVATORY_STATION_DESELECTED"},"*")}var d=document.querySelector("[role=dialog]");if(d&&info)addBtn(d,info)}new MutationObserver(check).observe(document.body,{childList:true,subtree:true});setInterval(check,1500)})()</script></body>';
            sub_filter_once on;
            sub_filter_types text/html;
        }
    }
}
