server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve .geojson with correct MIME type for gzip to work
    types {
        application/geo+json geojson;
    }

    location /api/ {
        return 404;
    }

    # Hashed assets from Vite — immutable, cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # GeoJSON static files — cache for 1 hour
    location /geo/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
